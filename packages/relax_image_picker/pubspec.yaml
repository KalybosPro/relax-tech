name: relax_image_picker
description: >-
  A WhatsApp-like media picker for Flutter: OS photo picker or in-app gallery
  grid, camera with video capture and playback, documents, preview and theming.
version: 3.0.1
resolution: workspace

repository: https://github.com/KalybosPro/relax-tech/tree/main/packages/relax_image_picker
issue_tracker: https://github.com/KalybosPro/relax-tech/issues

topics:
  - image-picker
  - media
  - camera
  - gallery
  - files

screenshots:
  - description: Default theme
    path: screenshots/default_theme.png
  - description: Custom theme with widget-slot builders
    path: screenshots/custom_theme.png

environment:
  sdk: ^3.11.0

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  photo_manager: ^3.9.0
  file_picker: ^11.0.2
  camera: ^0.12.0+1
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pdfx: ^2.9.2
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
